<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sorry Sana 💗</title>


  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#ffe4ef,#ffd6ea,#fff1f7);
      display:flex;
      justify-content:center;
      padding:28px;
    }

    .container{
      width:min(900px,96%);
      display:grid;
      grid-template-columns:1fr 380px;
      gap:30px;
      align-items:center;
    }

    .card{
      background:white;
      padding:30px;
      border-radius:20px;
      box-shadow:0 10px 28px rgba(255,60,160,0.2);
      border:2px solid #ffc4dd;
    }

    h1{
      margin:0;
      font-size:30px;
      color:#ff5a93;
      text-shadow:0px 0px 4px rgba(255,120,165,0.4);
    }

    .message{
      background:#fff5fa;
      padding:20px;
      border-radius:14px;
      margin-top:16px;
      font-size:16px;
      line-height:1.6;
      border:1px solid #ffcce1;
      color:#444;
    }

    .photo-card{
      position:relative;
      height:360px;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 10px 40px rgba(255,80,150,0.25);
      border:4px solid #ffb6d9;        /* soft pink border */
      background:white;
    }

    .photo-card img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:20px;
    }

    /* Floating hearts */
    .heart{
      position:absolute;
      width:22px;
      height:22px;
      background:#ff7cac;
      transform:rotate(45deg);
      animation: floatUp 5s linear infinite;
      opacity:0;
      border-radius:5px;
    }

    .heart::before,
    .heart::after{
      content:"";
      position:absolute;
      width:22px;
      height:22px;
      background:#ff7cac;
      border-radius:50%;
      top:-11px;
      left:0;
    }
    .heart::after{
      left:11px;
    }

    @keyframes floatUp {
      0% { transform:translateY(0) scale(0.8) rotate(45deg); opacity:0;}
      20% {opacity:1;}
      100% {transform:translateY(-260px) scale(1.4) rotate(45deg); opacity:0;}
    }

    .h1 { left:18%; bottom:10%; animation-delay:0s; }
    .h2 { left:45%; bottom:5%; animation-delay:1.2s; }
    .h3 { left:70%; bottom:18%; animation-delay:2.2s; }
    .h4 { left:32%; bottom:0%; animation-delay:3.3s; }

    /* Tap to forgive button */
    .forgive-btn{
      margin-top:24px;
      padding:14px 28px;
      background:#ff8fb8;
      color:white;
      border:none;
      border-radius:30px;
      font-size:18px;
      font-weight:600;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(255,65,140,0.3);
      transition:0.25s;
      width: 100%;
    }

    .forgive-btn:hover{
      transform:scale(1.05);
      background:#ff70a6;
      box-shadow:0 8px 18px rgba(255,80,140,0.4);
    }

    .forgive-btn:active{
      transform:scale(0.97);
    }

    /* Button popup message */
    #popup{
      margin-top:14px;
      color:#ff5e91;
      font-weight:600;
      font-size:17px;
      display:none;
      text-shadow:0 0 6px rgba(255,120,170,0.4);
    }

    @media(max-width:850px){
      .container{
        grid-template-columns:1fr;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="card">
      <h1>Sorry Sana 💗</h1>

      <div class="message">
        I know I messed up, Sana…  
        I shouldn’t have laughed when you fell from the jhula.  
        I should have supported you, held you, taken care of you.  
        I’m really, truly sorry.  
        Please forgive me… I promise it won’t happen again. 💗
      </div>

      <button class="forgive-btn" onclick="showForgiven()">Tap to Forgive 💗</button>

      <div id="popup">Thank you, Sana… you mean everything to me 💖</div>
    </div>
     <audio autoplay loop muted playsinline>
  <source src="./videoplayback.m4a" type="audio/mp4">
</audio>

    <div class="photo-card">
      <img src="./image.jpeg" alt="Sana and You">

      <div class="heart h1"></div>
      <div class="heart h2"></div>
      <div class="heart h3"></div>
      <div class="heart h4"></div>
    </div>

  </div>

  <script>
    function showForgiven(){
      document.getElementById("popup").style.display="block";
    }
  </script>

</body>
</html>
